<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;font-family:var(--font-body);background:var(--cha-white);color:var(--cha-ink);}
  .wrap{padding:22px 26px;display:flex;align-items:center;gap:24px;}
  .lock{display:flex;align-items:center;gap:14px;}
  .lock img{width:72px;height:72px;border-radius:14px;}
  .name{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1.05;}
  .voice{border-left:2px solid var(--cha-zinc-150);padding-left:22px;}
  .voice .tag{font-family:var(--font-display);font-weight:700;font-size:19px;}
  .voice p{margin:6px 0 0;font-size:12.5px;color:var(--cha-zinc-500);line-height:1.5;max-width:340px;}
</style></head>
<body>
<div class="wrap">
  <div class="lock">
    <img src="../assets/logo-cha-mark.png" alt="Cloud Heroes Africa" />
    <div class="name">CLOUD<br/>HEROES<br/>AFRICA</div>
  </div>
  <div class="voice">
    <div class="tag">"Empowering Africans to build world-class cloud careers — for free."</div>
    <p>Warm, encouraging, action-first. We speak to "you", celebrate momentum ("You're on a Roll!"), and keep it practical. Title Case for headings, sentence case for body.</p>
  </div>
</div>
</body></html>
