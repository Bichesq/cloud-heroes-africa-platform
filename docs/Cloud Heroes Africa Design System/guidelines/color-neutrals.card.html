<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;font-family:var(--font-body);background:var(--cha-white);}
  .row{display:flex;height:150px;}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;}
  .sw small{font-size:9px;}
  .sw b{font-size:12px;font-weight:600;}
  .lt{color:#fff;} .dk{color:var(--cha-ink);} .dk small{color:var(--cha-zinc-500);} .lt small{opacity:.8;}
</style></head>
<body>
<div class="row">
  <div class="sw lt" style="background:var(--cha-eclipse)"><b>eclipse</b><small>#18181B</small></div>
  <div class="sw lt" style="background:var(--cha-ink)"><b>ink</b><small>#1F1F21 · text</small></div>
  <div class="sw lt" style="background:var(--cha-zinc-700)"><b>zinc-700</b><small>#3E3E41</small></div>
  <div class="sw lt" style="background:var(--cha-zinc-500)"><b>zinc-500</b><small>#71717A · muted</small></div>
  <div class="sw dk" style="background:var(--cha-zinc-300)"><b>zinc-300</b><small>#B6B6BA</small></div>
  <div class="sw dk" style="background:var(--cha-zinc-200)"><b>zinc-200</b><small>border</small></div>
  <div class="sw dk" style="background:var(--cha-zinc-100)"><b>zinc-100</b><small>fill</small></div>
  <div class="sw dk" style="background:var(--cha-zinc-50);border-right:1px solid var(--cha-zinc-150)"><b>zinc-50</b><small>sunken</small></div>
</div>
</body></html>
