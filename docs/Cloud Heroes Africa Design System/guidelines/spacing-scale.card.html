<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base · used for gaps & padding" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;font-family:var(--font-body);background:var(--cha-white);color:var(--cha-ink);}
  .wrap{padding:20px 26px;display:flex;align-items:flex-end;gap:16px;}
  .u{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar{background:var(--color-primary);border-radius:3px;width:22px;}
  .u small{font-size:10px;color:var(--cha-zinc-400);}
</style></head>
<body>
<div class="wrap">
  <div class="u"><div class="bar" style="height:4px"></div><small>1 · 4</small></div>
  <div class="u"><div class="bar" style="height:8px"></div><small>2 · 8</small></div>
  <div class="u"><div class="bar" style="height:12px"></div><small>3 · 12</small></div>
  <div class="u"><div class="bar" style="height:16px"></div><small>4 · 16</small></div>
  <div class="u"><div class="bar" style="height:24px"></div><small>6 · 24</small></div>
  <div class="u"><div class="bar" style="height:32px"></div><small>8 · 32</small></div>
  <div class="u"><div class="bar" style="height:48px"></div><small>12 · 48</small></div>
  <div class="u"><div class="bar" style="height:64px"></div><small>16 · 64</small></div>
  <div class="u"><div class="bar" style="height:80px"></div><small>20 · 80</small></div>
</div>
</body></html>
