<!-- @dsCard group="Type" viewport="700x150" name="Type scale" subtitle="From caption to hero numeral" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;font-family:var(--font-body);background:var(--cha-white);color:var(--cha-ink);}
  .wrap{padding:16px 26px;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;}
  .s{display:flex;align-items:baseline;gap:6px;}
  .s b{font-family:var(--font-display);font-weight:700;}
  .s small{font-size:10px;color:var(--cha-zinc-400);}
</style></head>
<body>
<div class="wrap">
  <div class="s"><b style="font-size:50px;">50</b><small>display-xl</small></div>
  <div class="s"><b style="font-size:38px;">38</b><small>md</small></div>
  <div class="s"><b style="font-size:28px;">28</b><small>h2</small></div>
  <div class="s"><b style="font-size:23px;">23</b><small>h3</small></div>
  <div class="s"><b style="font-size:16px;">16</b><small>base</small></div>
  <div class="s"><b style="font-size:14px;">14</b><small>sm</small></div>
  <div class="s"><b style="font-size:12px;">12</b><small>xs</small></div>
</div>
</body></html>
