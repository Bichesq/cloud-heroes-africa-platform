<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;font-family:var(--font-body);background:var(--cha-white);}
  .row{display:flex;height:150px;}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#fff;}
  .sw small{opacity:.85;font-size:10px;}
  .sw b{font-size:13px;font-weight:600;}
  .dark small{color:var(--cha-zinc-500);}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--cha-orange-600)"><b>orange-600</b><small>#E8541A · primary</small></div>
  <div class="sw" style="background:var(--cha-orange-500)"><b>orange-500</b><small>#EC5A1C</small></div>
  <div class="sw" style="background:var(--cha-orange-400)"><b>orange-400</b><small>#FF8D28</small></div>
  <div class="sw dark" style="background:var(--cha-orange-300);color:var(--cha-ink)"><b>orange-300</b><small>track</small></div>
  <div class="sw dark" style="background:var(--cha-orange-100);color:var(--cha-ink)"><b>orange-100</b><small>#F7E4CD · soft</small></div>
</div>
</body></html>
