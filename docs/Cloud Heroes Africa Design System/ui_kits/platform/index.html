<!-- @startingPoint section="CHA Platform" subtitle="Full learning-platform shell with 4 screens" viewport="1440x900" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CHA Platform — UI Kit</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: var(--font-body); background: var(--cha-canvas); color: var(--text-primary); }
  #root { height: 100vh; }
  .switcher { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 50;
    display: flex; gap: 4px; background: var(--cha-eclipse); padding: 6px; border-radius: 999px; box-shadow: var(--shadow-lg); }
  .switcher button { border: none; background: transparent; color: rgba(255,255,255,0.6); font-family: var(--font-body);
    font-weight: 600; font-size: 13px; padding: 8px 16px; border-radius: 999px; cursor: pointer; }
  .switcher button.on { background: var(--color-primary); color: #fff; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="DashboardScreen.jsx"></script>
<script type="text/babel" src="ProfileScreen.jsx"></script>
<script type="text/babel" src="CalendarScreen.jsx"></script>
<script type="text/babel" src="LoginScreen.jsx"></script>
<script type="text/babel">
  const KEY = 'cha_uikit_screen';
  function App() {
    const [screen, setScreen] = React.useState(() => localStorage.getItem(KEY) || 'dashboard');
    const [theme, setTheme] = React.useState('light');
    React.useEffect(() => { localStorage.setItem(KEY, screen); }, [screen]);

    const screens = {
      dashboard: <window.DashboardScreen />,
      profile: <window.ProfileScreen />,
      calendar: <window.CalendarScreen />,
    };
    const tabs = [['dashboard','Dashboard'],['profile','Profile'],['calendar','Calendar'],['login','Login']];

    return (
      <React.Fragment>
        {screen === 'login'
          ? <window.LoginScreen />
          : <window.AppShell active={screen} onNavigate={setScreen} theme={theme} setTheme={setTheme}>
              {screens[screen]}
            </window.AppShell>}
        <div className="switcher">
          {tabs.map(([id, label]) => (
            <button key={id} className={screen === id ? 'on' : ''} onClick={() => setScreen(id)}>{label}</button>
          ))}
        </div>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
