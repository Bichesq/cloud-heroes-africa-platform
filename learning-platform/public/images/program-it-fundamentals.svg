<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="IT Fundamentals program cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#32a7d4"/>
      <stop offset="0.6" stop-color="#0485f7"/>
      <stop offset="1" stop-color="#0a5bb0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="400" cy="-60" rx="580" ry="230" fill="url(#glow)"/>
  <!-- circuit-style lines -->
  <g stroke="#f2f4fb" stroke-width="3" opacity="0.35" fill="none">
    <path d="M80 340 H240 V260 H360"/>
    <path d="M720 320 H580 V240 H470"/>
    <circle cx="80" cy="340" r="6" fill="#f2f4fb" stroke="none"/>
    <circle cx="720" cy="320" r="6" fill="#f2f4fb" stroke="none"/>
  </g>
  <!-- back cloud -->
  <g fill="#ffffff" opacity="0.4">
    <ellipse cx="620" cy="140" rx="100" ry="34"/>
    <circle cx="584" cy="118" r="34"/>
    <circle cx="632" cy="104" r="44"/>
    <circle cx="678" cy="124" r="28"/>
  </g>
  <!-- front cloud -->
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="250" cy="200" rx="135" ry="46"/>
    <circle cx="196" cy="170" r="46"/>
    <circle cx="258" cy="148" r="58"/>
    <circle cx="322" cy="176" r="38"/>
  </g>
  <!-- desktop device -->
  <g opacity="0.92">
    <rect x="470" y="228" width="180" height="112" rx="10" fill="#f2f4fb"/>
    <rect x="484" y="242" width="152" height="72" rx="5" fill="#32a7d4" opacity="0.7"/>
    <rect x="498" y="254" width="80" height="8" rx="4" fill="#f2f4fb"/>
    <rect x="498" y="270" width="120" height="8" rx="4" fill="#f2f4fb" opacity="0.7"/>
    <rect x="498" y="286" width="100" height="8" rx="4" fill="#f2f4fb" opacity="0.5"/>
    <rect x="540" y="344" width="40" height="10" rx="5" fill="#f2f4fb"/>
  </g>
  <circle cx="130" cy="330" r="26" fill="#e8541a" opacity="0.9"/>
  <text x="60" y="404" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="700" fill="#ffffff">IT Fundamentals</text>
</svg>
