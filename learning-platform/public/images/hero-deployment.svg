<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Cloud Deployment Models">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#32a7d4"/>
      <stop offset="0.6" stop-color="#0485f7"/>
      <stop offset="1" stop-color="#f2f4fb"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="400" cy="-50" rx="580" ry="230" fill="url(#glow)"/>
  <!-- public cloud (left) -->
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="190" cy="220" rx="115" ry="42"/>
    <circle cx="144" cy="192" r="42"/>
    <circle cx="196" cy="172" r="54"/>
    <circle cx="250" cy="198" r="36"/>
  </g>
  <text x="190" y="232" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#0485f7">PUBLIC</text>
  <!-- private cloud (right, inside a fence rectangle) -->
  <rect x="490" y="130" width="250" height="170" rx="16" fill="none" stroke="#0d3a5c" stroke-width="4" stroke-dasharray="12 8" opacity="0.7"/>
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="614" cy="240" rx="100" ry="36"/>
    <circle cx="574" cy="216" r="36"/>
    <circle cx="620" cy="198" r="46"/>
    <circle cx="668" cy="222" r="30"/>
  </g>
  <text x="614" y="250" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#e8541a">PRIVATE</text>
  <!-- hybrid link -->
  <g stroke="#e8541a" stroke-width="6" stroke-linecap="round" opacity="0.85" fill="none">
    <path d="M310 236 C 380 270, 420 270, 486 244"/>
  </g>
  <circle cx="310" cy="236" r="9" fill="#e8541a"/>
  <circle cx="486" cy="244" r="9" fill="#e8541a"/>
  <text x="398" y="300" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#7a2708">HYBRID LINK</text>
  <!-- small buildings under private cloud -->
  <g opacity="0.85">
    <rect x="560" y="330" width="40" height="60" rx="4" fill="#0d3a5c"/>
    <rect x="608" y="346" width="40" height="44" rx="4" fill="#0d3a5c" opacity="0.8"/>
    <rect x="568" y="340" width="10" height="10" fill="#7fd4f5"/>
    <rect x="584" y="340" width="10" height="10" fill="#7fd4f5"/>
    <rect x="568" y="358" width="10" height="10" fill="#7fd4f5"/>
    <rect x="584" y="358" width="10" height="10" fill="#7fd4f5"/>
  </g>
  <!-- devices under public cloud -->
  <g opacity="0.85">
    <rect x="130" y="340" width="70" height="46" rx="6" fill="#0d3a5c"/>
    <rect x="138" y="348" width="54" height="26" rx="3" fill="#7fd4f5"/>
    <rect x="218" y="346" width="26" height="42" rx="6" fill="#0d3a5c"/>
    <rect x="222" y="352" width="18" height="26" rx="2" fill="#7fd4f5"/>
  </g>
  <text x="400" y="70" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">Cloud Deployment Models</text>
</svg>
