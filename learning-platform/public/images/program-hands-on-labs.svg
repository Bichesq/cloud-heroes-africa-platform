<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Hands On Labs program cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8541a"/>
      <stop offset="0.6" stop-color="#f07a3c"/>
      <stop offset="1" stop-color="#f2f4fb"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="400" cy="-50" rx="570" ry="220" fill="url(#glow)"/>
  <circle cx="120" cy="100" r="44" fill="#32a7d4" opacity="0.85"/>
  <!-- back cloud -->
  <g fill="#ffffff" opacity="0.4">
    <ellipse cx="640" cy="130" rx="95" ry="32"/>
    <circle cx="606" cy="110" r="32"/>
    <circle cx="650" cy="96" r="42"/>
    <circle cx="694" cy="116" r="26"/>
  </g>
  <!-- front cloud -->
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="560" cy="270" rx="140" ry="48"/>
    <circle cx="504" cy="238" r="48"/>
    <circle cx="566" cy="214" r="60"/>
    <circle cx="630" cy="244" r="40"/>
  </g>
  <!-- laptop with terminal -->
  <g opacity="0.95">
    <rect x="130" y="200" width="240" height="150" rx="12" fill="#0d3a5c"/>
    <rect x="146" y="216" width="208" height="118" rx="6" fill="#123f66"/>
    <text x="160" y="248" font-family="Consolas, monospace" font-size="20" fill="#f2f4fb">$ aws s3 ls</text>
    <text x="160" y="278" font-family="Consolas, monospace" font-size="20" fill="#7fd4f5">cha-lab-01</text>
    <text x="160" y="308" font-family="Consolas, monospace" font-size="20" fill="#7fd4f5">cha-lab-02</text>
    <rect x="106" y="350" width="288" height="14" rx="7" fill="#0d3a5c"/>
  </g>
  <!-- gear accent -->
  <g transform="translate(430 340)" fill="#0485f7" opacity="0.8">
    <circle r="24"/>
    <rect x="-6" y="-38" width="12" height="14" rx="3"/>
    <rect x="-6" y="24" width="12" height="14" rx="3"/>
    <rect x="24" y="-6" width="14" height="12" rx="3"/>
    <rect x="-38" y="-6" width="14" height="12" rx="3"/>
    <circle r="10" fill="#f2f4fb"/>
  </g>
  <text x="60" y="416" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="700" fill="#7a2708">Hands On Labs</text>
</svg>
