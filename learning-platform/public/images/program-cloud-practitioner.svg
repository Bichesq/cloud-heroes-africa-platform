<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Cloud Practitioner program cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0485f7"/>
      <stop offset="0.55" stop-color="#32a7d4"/>
      <stop offset="1" stop-color="#f2f4fb"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8541a"/>
      <stop offset="1" stop-color="#f28a55"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="400" cy="-40" rx="560" ry="220" fill="url(#glow)"/>
  <circle cx="660" cy="96" r="52" fill="url(#sun)" opacity="0.9"/>
  <!-- back cloud -->
  <g fill="#ffffff" opacity="0.35">
    <ellipse cx="150" cy="170" rx="95" ry="34"/>
    <circle cx="115" cy="148" r="34"/>
    <circle cx="165" cy="136" r="42"/>
    <circle cx="210" cy="156" r="28"/>
  </g>
  <!-- mid cloud -->
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="600" cy="230" rx="110" ry="38"/>
    <circle cx="560" cy="204" r="38"/>
    <circle cx="612" cy="188" r="48"/>
    <circle cx="662" cy="212" r="32"/>
  </g>
  <!-- front cloud -->
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="330" cy="300" rx="150" ry="52"/>
    <circle cx="270" cy="266" r="52"/>
    <circle cx="340" cy="240" r="66"/>
    <circle cx="410" cy="272" r="44"/>
  </g>
  <!-- device rectangles -->
  <g opacity="0.85">
    <rect x="520" y="318" width="120" height="76" rx="8" fill="#f2f4fb"/>
    <rect x="532" y="330" width="96" height="44" rx="4" fill="#32a7d4" opacity="0.65"/>
    <rect x="566" y="398" width="28" height="8" rx="4" fill="#f2f4fb"/>
    <rect x="668" y="342" width="44" height="72" rx="8" fill="#f2f4fb"/>
    <rect x="676" y="352" width="28" height="44" rx="3" fill="#0485f7" opacity="0.6"/>
  </g>
  <text x="60" y="404" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="700" fill="#0d3a5c">Cloud Practitioner</text>
</svg>
