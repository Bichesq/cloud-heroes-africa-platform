<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Understanding Cloud Computing Basics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0485f7"/>
      <stop offset="0.65" stop-color="#32a7d4"/>
      <stop offset="1" stop-color="#f2f4fb"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="400" cy="-50" rx="580" ry="230" fill="url(#glow)"/>
  <circle cx="700" cy="80" r="42" fill="#e8541a" opacity="0.85"/>
  <!-- back clouds -->
  <g fill="#ffffff" opacity="0.4">
    <ellipse cx="150" cy="120" rx="90" ry="30"/>
    <circle cx="118" cy="100" r="30"/>
    <circle cx="160" cy="88" r="38"/>
    <circle cx="200" cy="106" r="24"/>
  </g>
  <g fill="#ffffff" opacity="0.5">
    <ellipse cx="560" cy="150" rx="100" ry="34"/>
    <circle cx="524" cy="128" r="34"/>
    <circle cx="572" cy="112" r="44"/>
    <circle cx="618" cy="134" r="28"/>
  </g>
  <!-- main cloud -->
  <g fill="#ffffff" opacity="0.97">
    <ellipse cx="400" cy="222" rx="165" ry="56"/>
    <circle cx="332" cy="186" r="56"/>
    <circle cx="404" cy="156" r="72"/>
    <circle cx="480" cy="190" r="48"/>
  </g>
  <!-- connection lines from cloud to devices -->
  <g stroke="#0d3a5c" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M300 262 L200 330"/>
    <path d="M400 272 L400 330"/>
    <path d="M500 262 L600 330"/>
  </g>
  <!-- devices -->
  <g opacity="0.92">
    <rect x="152" y="330" width="96" height="62" rx="8" fill="#0d3a5c"/>
    <rect x="162" y="340" width="76" height="36" rx="4" fill="#7fd4f5"/>
    <rect x="184" y="392" width="32" height="8" rx="4" fill="#0d3a5c"/>
    <rect x="374" y="330" width="52" height="76" rx="10" fill="#0d3a5c"/>
    <rect x="382" y="340" width="36" height="50" rx="4" fill="#7fd4f5"/>
    <rect x="560" y="330" width="80" height="70" rx="8" fill="#0d3a5c"/>
    <rect x="570" y="340" width="60" height="12" rx="3" fill="#7fd4f5"/>
    <rect x="570" y="358" width="60" height="12" rx="3" fill="#7fd4f5" opacity="0.7"/>
    <rect x="570" y="376" width="60" height="12" rx="3" fill="#7fd4f5" opacity="0.45"/>
  </g>
  <text x="400" y="70" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Understanding Cloud Computing Basics</text>
</svg>
